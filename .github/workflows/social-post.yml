name: Instagram — публикация по очереди

on:
  schedule:
    - cron: '17 * * * *' # каждый час в :17 (время UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: 'check — проверить доступ, dry-run — показать, что вышло бы, publish — опубликовать'
        type: choice
        options: [check, dry-run, publish]
        default: check
  push: # проверка доступа при изменениях бота на рабочей ветке (ничего не публикует)
    branches: [ccr-c4657446-m4wbw4]
    paths: ['social-bot/**', '.github/workflows/social-post.yml']

permissions:
  contents: write

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Запуск бота
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          MODE: ${{ inputs.mode || (github.event_name == 'push' && 'check') || 'publish' }}
        run: node social-bot/publish.mjs "$MODE"
      - name: Сохранить статусы очереди
        if: always() && github.event_name != 'push'
        run: |
          git config user.name "social-bot"
          git config user.email "social-bot@users.noreply.github.com"
          git add social-bot/queue.json
          git diff --cached --quiet && exit 0
          git commit -m "social-bot: обновление статусов очереди"
          # если очередь правили во время запуска — подтягиваем изменения и пробуем ещё раз
          for i in 1 2 3; do
            git pull --rebase -q origin "$GITHUB_REF_NAME" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::warning::Статусы очереди не сохранились (конфликт правок queue.json). Повтора не будет: бот сверяет подпись с последними постами."
          exit 1
